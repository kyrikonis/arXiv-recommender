[project]
name = "arxiv-recommender"
version = "0.1.0"
description = "Personal arXiv paper recommender with a learned reranker and a temporal evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adapters>=1.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "torch==2.14.1",
    "transformers>=4.57.6",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "recommender"

# PyPI's Windows torch wheels are CPU-only, so the CUDA build for my PC comes from PyTorch's
# own index. Linux (GitHub Actions, Docker) gets the CPU-only build instead of ~2 GB of CUDA
# libraries it has no GPU to use.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
