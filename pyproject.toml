[project]
name = "arxiv-recommender"
version = "0.1.0"
description = "Personal arXiv paper recommender with a learned reranker and a temporal evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adapters>=1.3.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "transformers>=4.57.6",
    "tzdata>=2026.5",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "recommender"

# PyPI's Windows torch wheels are CPU-only; the CUDA build comes from PyTorch's own index.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
